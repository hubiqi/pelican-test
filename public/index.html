<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>鹈鹕测试 · The Pelican Test</title>
<style>
  :root { --ink: #e8e2d6; --dim: #8d8578; --line: #2a2823; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0b0c; color: var(--ink);
    font-family: Georgia, "Times New Roman", "Noto Serif SC", serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #stage { flex: 1 1 auto; position: relative; min-height: 0; overflow: hidden; }
  #stage canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    box-shadow: 0 0 60px rgba(0,0,0,.9); }
  #bar { flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    padding: 9px 16px calc(9px + env(safe-area-inset-bottom)); background: #111112;
    border-top: 1px solid var(--line); font-size: 13px; letter-spacing: .02em; }
  #play { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #3a3730;
    background: #1b1a18; color: var(--ink); font-size: 13px; cursor: pointer; line-height: 1; }
  #play:hover { background: #262420; }
  #scrub { flex: 1 1 auto; -webkit-appearance: none; appearance: none; height: 4px;
    background: #2a2823; border-radius: 3px; outline: none; }
  #scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: #d8cfbc; cursor: pointer; }
  #scrub::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%;
    background: #d8cfbc; cursor: pointer; }
  #label { min-width: 190px; color: var(--dim); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; text-align: right; }
  #label b { color: var(--ink); font-weight: normal; }
  #clock { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 96px; text-align: right; }
  body.noui #bar { display: none; }
  #hud { position: fixed; left: 10px; top: 8px; font: 11px/1.4 ui-monospace, monospace;
    color: #9d968a; background: rgba(0,0,0,.55); padding: 4px 7px; border-radius: 4px;
    pointer-events: none; display: none; }
  body.hud #hud { display: block; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"></div>
  <div id="bar">
    <button id="play" title="播放 / 暂停">❚❚</button>
    <input id="scrub" type="range" min="0" max="137" step="0.01" value="0">
    <div id="label">—</div>
    <div id="clock">0:00 / 2:17</div>
  </div>
</div>
<div id="hud"></div>

<script>
  // ---- 运行期错误收集（开发用）----
  window.__ERRS__ = [];
  window.addEventListener('error', function (e) {
    window.__ERRS__.push((e.message || '') + ' @ ' + (e.filename || '') + ':' + e.lineno);
    console.error(e.message);
  });
  window.addEventListener('unhandledrejection', function (e) {
    window.__ERRS__.push('rej: ' + (e.reason && e.reason.message || e.reason));
    console.error(e.reason);
  });
</script>
<script src="vendor/p5.min.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  // 开发时给每个脚本加时间戳，避免浏览器拿旧缓存；导出时用 ?v=0 走浏览器缓存
  const V = q.get('v') === '0' ? '0' : String(Date.now());

  const FILES = [
    '../src/beat.js',
    '../src/kit.js',
    '../src/rig.js',
    '../src/camera.js',
    '../src/scenes/_placeholder.js',
    '../src/scenes/intro.js',
    '../src/scenes/s01-sahara.js',
    '../src/scenes/s02-egypt.js',
    '../src/scenes/s03-hanstone.js',
    '../src/scenes/s04-tang.js',
    '../src/scenes/s05-song.js',
    '../src/scenes/s06-qingming.js',
    '../src/scenes/s07-maya.js',
    '../src/scenes/s08-mughal.js',
    '../src/scenes/s09-bada.js',
    '../src/scenes/s10-wayang.js',
    '../src/scenes/s11-ukiyoe.js',
    '../src/scenes/s12-vangogh.js',
    '../src/scenes/s13-scream.js',
    '../src/scenes/s14-nosferatu.js',
    '../src/scenes/s15-scope.js',
    '../src/scenes/s16-8bit.js',
    '../src/scenes/s17-chat.js',
    '../src/scenes/s18-vaporwave.js',
    '../src/scenes/s19-vertical.js',
    '../src/scenes/s20-code.js',
    '../src/scenes/outro.js',
    '../src/main.js',
  ];

  function loadOne(src) {
    return new Promise(function (res, rej) {
      const s = document.createElement('script');
      s.src = src + (V === '0' ? '' : '?v=' + V);
      s.onload = res; s.onerror = function () { rej(new Error('load fail ' + src)); };
      document.body.appendChild(s);
    });
  }

  (async function () {
    for (const f of FILES) await loadOne(f);
    boot(q);
  })();

  function boot(q) {
    const hasT = q.has('t');
    const startT = hasT ? (parseFloat(q.get('t')) || 0) : 0;
    const uiOff = q.get('ui') === '0';
    const hudOn = q.get('hud') === '1';
    const paused = q.get('play') === '0' || hasT;
    document.body.classList.toggle('noui', uiOff);
    document.body.classList.toggle('hud', hudOn);

    const playBtn = document.getElementById('play');
    const scrub = document.getElementById('scrub');
    const label = document.getElementById('label');
    const clock = document.getElementById('clock');
    const hud = document.getElementById('hud');
    const B = PEL.beat, D = PEL.director;

    function fmt(s) {
      const m = Math.floor(s / 60), ss = Math.floor(s % 60);
      return m + ':' + String(ss).padStart(2, '0');
    }
    function blockName(t) {
      const info = B.blockAt(t);
      if (info.index === 0) return { zh: '开场 · Introduction' };
      if (info.index >= 21) return { zh: '结尾 · 新闻发布会' };
      const sc = D.sceneByIndex(info.index);
      return sc ? { zh: info.index + ' / 20 · ' + sc.zh } : { zh: '—' };
    }
    function fitCanvas(c) {
      const el = c.elt, box = document.getElementById('stage');
      function apply() {
        const s = Math.min(box.clientWidth / 1920, box.clientHeight / 1080);
        el.style.width = Math.round(1920 * s) + 'px';
        el.style.height = Math.round(1080 * s) + 'px';
      }
      apply();
      window.addEventListener('resize', apply);
    }
    function syncUI() {
      const t = D.t;
      scrub.value = t;
      label.innerHTML = '<b>' + blockName(t).zh + '</b>';
      clock.textContent = fmt(t) + ' / ' + fmt(B.TOTAL);
      playBtn.textContent = D.isPlaying() ? '❚❚' : '▶';
    }

    scrub.max = B.TOTAL.toFixed(3);

    const sketch = function (p) {
      p.setup = function () {
        const c = p.createCanvas(1920, 1080);
        c.parent('stage');
        p.pixelDensity(parseFloat(q.get('dpr') || '1'));
        p.textFont('Georgia, serif');
        D.init(p, { bakeSize: parseInt(q.get('bake') || '256', 10) });
        fitCanvas(c);
        D.t = startT;
        D.frozen = paused;
        D.frozenT = startT;
        D.playing = !paused;
        if (paused && startT > B.BLOCKS_END - 3) D.bakeAll();
        syncUI();
        window.__READY__ = true;
      };
      p.draw = function () {
        D.tick(p);
        if (p.frameCount % 3 === 0) syncUI();
        if (hudOn) {
          const info = B.blockAt(D.t), cam = PEL.camera.state(D.t);
          hud.textContent = 't=' + D.t.toFixed(2) + '  blk=' + info.index +
            '  fps=' + p.frameRate().toFixed(1) + '  cam=' + cam.index.toFixed(2) +
            '  zoom=' + cam.zoom.toFixed(3) + '  frozen=' + !!D.frozen;
        }
      };
    };

    playBtn.addEventListener('click', function () {
      if (D.isPlaying()) D.pause(); else D.play();
      syncUI();
    });
    scrub.addEventListener('input', function () {
      D.pause();
      D.seek(parseFloat(scrub.value));
      syncUI();
    });
    window.addEventListener('keydown', function (e) {
      if (e.code === 'Space') { e.preventDefault(); D.isPlaying() ? D.pause() : D.play(); syncUI(); }
      if (e.code === 'ArrowRight') { D.seek(D.t + 1); syncUI(); }
      if (e.code === 'ArrowLeft') { D.seek(D.t - 1); syncUI(); }
      if (e.code === 'KeyH') document.body.classList.toggle('hud');
    });

    new p5(sketch);
  }
})();
</script>
</body>
</html>
